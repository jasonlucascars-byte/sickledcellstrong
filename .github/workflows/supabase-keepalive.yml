# Keeps both Supabase projects awake.
#
# Supabase's free plan pauses a project after 1 week with no activity. A paused
# project means families can't sign in, sync, or redeem invites, and the landing
# page's Founding Beta form stops saving. This job makes one tiny read against
# each project every 3 days, well inside that window.
#
# It uses only the publishable (public) keys, which are already shipped to every
# browser. Row-level security still applies, so the reads return nothing private,
# and response bodies are never printed.
#
# If a project is unreachable (for example, already paused), the job fails and
# GitHub emails the repo owner.
#
# Note: GitHub turns off scheduled workflows in a repo with no commits for 60
# days. Any push to the repo turns it back on, or re-enable it from the Actions tab.
#
# Remove this file once the projects move to Supabase Pro (Pro never pauses).

name: Supabase keep-alive

on:
  schedule:
    - cron: "17 14 */3 * *"   # every 3 days, 14:17 UTC
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping app and landing databases
        run: |
          set -u
          ping() {
            name="$1"; url="$2"; key="$3"
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
              -H "apikey: $key" "$url" || echo 000)
            echo "$name: HTTP $code"
            # 2xx = query ran; 401/403 = database reached but read not allowed.
            # Anything else (000, 5xx, 540 paused) means the project is unreachable.
            case "$code" in
              2??|401|403) return 0 ;;
              *) return 1 ;;
            esac
          }

          failed=0
          ping "App (Sickle Strong)" \
            "https://zprmzrngdgniexphjgem.supabase.co/rest/v1/families?select=id&limit=1" \
            "sb_publishable_WmLZG2BU3k_ex42SLK-4TA_XpoUIJeV" || failed=1
          ping "Landing (SickleStrong Landing)" \
            "https://pmpybzbyjrcibysxvusc.supabase.co/rest/v1/beta_signups?select=id&limit=1" \
            "sb_publishable_1AvpA3G6cCsTbg8-gy2S8Q_wi2ry9Ad" || failed=1

          if [ "$failed" -ne 0 ]; then
            echo "::error::A Supabase project did not respond. It may be paused: restore it at https://supabase.com/dashboard"
            exit 1
          fi
