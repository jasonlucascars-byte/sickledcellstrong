# No [build] section on purpose: this is a zero-build static site and the publish
# directory stays configured in the Netlify UI. Adding one here would override it.

# The document and the app script both have unversioned filenames, so they have
# to revalidate — a long max-age would leave families on a stale build until
# their browser cache expired. Revalidation is cheap (a 304), and the
# "efficient cache policy" audit is a Lighthouse diagnostic rather than a
# scored metric, so there is nothing to win by getting this wrong.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The service worker must never be served from cache, or a released fix can sit
# behind an old worker indefinitely.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Icons are content-stable: a change ships under a new filename, so these can be
# held for a year. Previously they revalidated on every visit for no reason.
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"
